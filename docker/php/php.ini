; Valores mínimos desejados da Infrastructure (architecture.md → Dimensionamento).
; OPcache fica DESLIGADO de propósito: a HostGator não o oferece (ADR-005).
; Na imagem php:8.4 ele vem embutido e ligado, então precisa ser desativado aqui.
opcache.enable = 0
opcache.enable_cli = 0

memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 13M
max_execution_time = 60

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

date.timezone = UTC
