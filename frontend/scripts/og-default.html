<!doctype html>
<!--
  Fonte da imagem de pré-visualização padrão (frontend/public/og-default.png, 1200 × 630), usada no Open Graph das páginas
  sem imagem própria. Usa o símbolo de `public/logos/simbolo.png` (gerado por `scripts/optimize-images.py`). Para gerar de
  novo, a partir de e2e/ (onde o Playwright está instalado):

    npx playwright screenshot --viewport-size=1200,630 file:///<caminho>/frontend/scripts/og-default.html ../frontend/public/og-default.png

  Cores = tokens da marca de app/app.css (fundo branco para o disco gelo do símbolo aparecer, título no tom do rodapé, faixa e apoio na cor primária).
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #ffffff;
        border-bottom: 18px solid #2a6c82;
        color: #043546;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 96px;
      }
      img { width: 300px; height: 300px; flex: none; }
      .text { display: flex; flex-direction: column; gap: 28px; }
      .acronym { font-size: 34px; font-weight: 800; letter-spacing: 0.14em; color: #2a6c82; }
      h1 { font-size: 72px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; }
      p { font-size: 34px; color: #043546; }
    </style>
  </head>
  <body>
    <img src="../public/logos/simbolo.png" alt="" />
    <div class="text">
      <span class="acronym">PIBLS</span>
      <h1>Primeira Igreja Batista em Lagoa Santa</h1>
      <p>Aqui as pessoas importam.</p>
    </div>
  </body>
</html>
