# Ambiente local (T007). Credenciais abaixo valem SÓ para esta máquina.
#   docker compose up -d                       # Apache + PHP 8.4 sem OPcache, MySQL 8.0, Mailpit
#   docker compose --profile mysql57 up -d     # acrescenta o MySQL 5.7 (porta 3317)
name: pibls

x-mysql-command: &mysql-command
  - --character-set-server=utf8mb4
  - --collation-server=utf8mb4_unicode_ci
  - --default-time-zone=+00:00

services:
  app:
    build:
      context: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      # Só para o export do OpenAPI (`scramble:export --path=../docs/openapi.json`), que escreve fora do backend
      - ./docs:/var/www/docs
      # Testes do ativador de release (deploy/finalize.php), que o Pest do backend também roda
      - ./deploy:/var/www/deploy
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: *mysql-command
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pibls
      MYSQL_USER: pibls_app
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:3316:3306" # 3306 costuma estar ocupada por um MySQL local
    volumes:
      - mysql80-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Reproduz a outra versão possível do servidor (TBD-01). Sem imagem arm64.
  mysql57:
    profiles: ["mysql57"]
    image: mysql:5.7
    platform: linux/amd64
    command: *mysql-command
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pibls
      MYSQL_USER: pibls_app
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - mysql57-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025" # interface web
      - "127.0.0.1:1025:1025" # SMTP

volumes:
  mysql80-data:
  mysql57-data:
